name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      real_backend_e2e:
        description: Run isolated Playwright integration with real Python models
        type: boolean
        default: false

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify clean Python 3.13 wheel resolution
        run: >-
          python -m pip install --dry-run --ignore-installed --only-binary=:all:
          --report "${{ runner.temp }}/backend-resolution.json" -r requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip check

      - name: Bandit static security scan (blocking)
        run: python -m pip install bandit && python -m bandit -q -r . --exclude ./tests -f txt

      - name: pip-audit dependency scan (advisory)
        # Non-blocking: framework pins (e.g. starlette via FastAPI) cannot be
        # bumped without a full compatibility pass; findings are surfaced here.
        continue-on-error: true
        run: python -m pip install pip-audit && python -m pip-audit -r requirements.txt

      - name: Run isolated full backend regression
        working-directory: .
        # Local Windows equivalent from the repository root:
        # .venv/Scripts/python.exe -B -m pytest -p no:cacheprovider backend/tests -v --tb=short
        # conftest isolates database/ledger writes in temporary directories.
        run: python -B -m pytest -p no:cacheprovider backend/tests -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22 (Vite 8 requires 20.19+ or 22.12+)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up backend for E2E tests
        id: backend-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --only-binary=:all: -r ../backend/requirements.txt
          python -m pip check

      - name: Start isolated demo backend for existing browser tests
        env:
          DEMO_MODE: "true"
          DATABASE_URL: "sqlite:///${{ runner.temp }}/atlas-e2e/demo.db"
          CHAIN_BACKEND: "db"
          COOKIE_SECURE: "false"
          SECRET_KEY: "ci-demo-only-access-secret-at-least-32-chars"
          REFRESH_SECRET_KEY: "ci-demo-only-refresh-secret-at-least-32-chars"
          ENCRYPTION_KEY: ""
          SSL_CERTFILE: ""
          SSL_KEYFILE: ""
          SMS_PROVIDER: "fast2sms"
          FAST2SMS_API_KEY: ""
          SMTP_HOST: ""
          SMTP_USER: ""
          SMTP_PASSWORD: ""
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-e2e"
          cd "$RUNNER_TEMP/atlas-e2e"
          python -B "$GITHUB_WORKSPACE/backend/start.py" > "$RUNNER_TEMP/backend-e2e.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend-e2e.pid"
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/live > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/health/live

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npx vitest run

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Optional isolated real-backend browser integration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_backend_e2e }}
        env:
          ATLAS_REAL_BACKEND_E2E: "1"
          ATLAS_TEST_PYTHON: ${{ steps.backend-python.outputs.python-path }}
        # The bridge uses its own temporary DB/ledger and blocks external senders.
        run: npm run test:e2e -- e2e/real-backend.spec.ts --workers=1

      - name: Stop demo backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend-e2e.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/backend-e2e.pid")" || true
          fi
